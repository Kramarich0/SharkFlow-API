name: Doxynix Documentation Sync

on:
  push:
    branches: [ main ]

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Doxynix Analysis
        uses: doxynix/doxynix-action@main
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        
        with:
          doxynix-token: ${{ secrets.DOXYNIX_TOKEN }}
          branch: 'main'
